    Push: { name: "押す日", ex: [["インクラインベンチプレス", "4×6–10"], ["ダンベルショルダープレス", "3×8–10"], ["ディップス or チェストプレス", "3×8–12"], ["ケーブルフライ", "3×12–15"], ["サイドレイズ", "4×12–20"], ["オーバーヘッドトライセプス", "3×10–12"]] },

    Legs: { name: "脚", ex: [["ハックスクワット or スミススクワット", "4×8–10"], ["ブルガリアンスクワット", "3×8–10/脚"], ["ヒップスラスト", "3×8–12"], ["レッグエクステンション", "3×12–15"], ["シーテッドレッグカール", "3×10–15"], ["カーフレイズ（座って）", "4×12–15"], ["ケーブルクランチ", "3×12–15"]] }
  };

    { label: "追い込み", rule: "最終セットは限界まで（BIG3は1回残す）" }
  ];

  // ---- 01_calendar.md / 00 / 10 ----
  const DATED = {
    "2026-09-27": ["Day1：計測・写真4枚・動画"],
    "2026-10-04": ["初回の週次レビュー"],
    "2026-10-10": ["トーストマスターズ見学① 10:00"],
    "2026-10-11": ["#4 調整期間の判定（カロリー確定）"],
    "2026-10-24": ["トーストマスターズ見学② 10:00"],
    "2026-10-25": ["中間判定（ウエスト−3cm・体脂肪17.5%）"],
    "2026-11-08": ["ダーマペン最後の施術の期限", "手法の見直し（08）"],
    "2026-11-14": ["トーストマスターズ見学③ 10:00"],
    "2026-11-22": ["最終判定：計測・Before/After・次の8週間を計画"]
  };
  const WEEK_NOTES = [
    ["皮膚科2院のカウンセリング（在宅日）→ ダーマペン1回目（9/30–10/8）", "一般歯科で虫歯チェック・クリーニング", "矯正歯科2–3院の相談を予約", "眉を整える（W2まで）", "トーストマスターズに見学のメール・VRChat初回"],
    ["矯正の初診相談（2–3院）→ 精密検査を予約", "ダーマペン1回目（まだなら）"],
    ["矯正の精密検査", "黒ずみ型：肌2回目（10/13–10/22）"],
    ["矯正の治療計画の説明 → 1週間考える", "施術後の経過を写真で記録"],
    ["矯正の契約 → 前処置", "黒ずみ型：肌3回目（10/27–11/6）"],
    ["開き型：肌2回目（10/28–11/6）", "ワイヤーなら装置の装着"],

  ];

  // ---- 04_nutrition.md 1週間の献立例（曜日で引く） ----

    ["B オートミール", "鶏もも（皮なし）の照り焼き・ご飯150g・蒸し野菜", "生鮭のホイル焼き180g・ご飯100g・小松菜・冷奴"],
    ["A 和の定番", null, "豚ヒレのピカタ180g・ご飯100g・キャベツ・わかめのみそ汁"],

    ["D 鮭おにぎり", null, "えび・いかのトマトパスタ（パプリカ・ブロッコリー）"],
    ["A 和の定番", "豚ももの生姜焼き・ご飯150g・ピーマンともやし", "まぐろ赤身の漬け丼（ご飯100g）・ほうれん草・豆腐とわかめのみそ汁"],

  // ---- 出社日と筋トレの割り当て ----
  const officeDays = store.get("office", {});
  const getOffice = w => officeDays[w] || DEFAULT_OFFICE;

  function planWeek(w) {
    const office = getOffice(w);
    const free = [0, 1, 2, 3, 4, 5, 6].filter(d => !office.includes(d));
    const seqs = { 7: ["U", "L", "Push", "rest", "Pull", "Legs", "rest"], 6: ["U", "L", "Push", "rest", "Pull", "Legs"], 5: ["U", "L", "Push", "Pull", "Legs"], 4: ["U", "L", "U", "L"] };
    const seq = seqs[free.length] || ["U", "L", "U"].slice(0, free.length);
    const out = Array(7).fill(null).map((_, d) => ({ type: office.includes(d) ? "office" : "rest", hiit: false }));
    free.forEach((d, i) => { out[d].type = seq[i] || "rest"; });
    // HIIT: W1–2 は Push（なければ最初のU）、W3以降は U と Push、W6 はなし
    if (w !== 5) {
      const hasPush = out.some(o => o.type === "Push");
      out.forEach((o, i) => {
        if (w <= 1) { if (o.type === "Push") o.hiit = true; }
        else if (o.type === "Push" || (o.type === "U" && out.findIndex(x => x.type === "U") === i)) o.hiit = true;
      });
      if (w <= 1 && !hasPush) { const u = out.find(o => o.type === "U"); if (u) u.hiit = true; }
    }
    return out;
  }

  function dayInfo(d) {
    const w = weekOf(d), dow = d.getDay();
    if (w >= 8) return { w, dow, type: "judge", hiit: false };
    const p = planWeek(w)[dow];
    return { w, dow, type: p.type, hiit: p.hiit };

      ["m-mirror", "7:05", "鏡で正面と横顔を10秒見る", "気になる点を1つだけ言葉にする"],
      ["m-skin", "7:10", "洗顔 → 保湿 → 日焼け止め", "SPF30以上"],
      ["m-food", "7:15", "朝食（朝の型A–D）", "今日の型は「今日」タブの食事欄"],
      ["m-sleep", "7:30", "前夜の睡眠時間を確認", "6時間未満が週3日で08の#2"]
    ]],
    ["日中", [
      ["d-steps", "", "1万歩", "足りなければ夜に家のトレッドミル"],
      ["d-face", "", "顔・首＋発声のルーティン15分（05→09）", "車の中で。車に乗らない日は家で"],
      ["d-talk", "", "自分から話しかける1回（雑談・相談・お礼）", ""],
      ["d-snack", "15:30", "間食（間食の型から1つ）", "筋トレの日は筋トレ直後でもよい"]
    ]],
    ["夜", [
      ["n-asken", "23:30", "あすけんの入れ忘れ確認・翌日の準備", "タンパク質170gに届いたか"],
      ["n-skin", "0:00", "コンタクトを外す → 洗顔 → 保湿", "〜11/22はレチノールを使わない"],
      ["n-posture", "0:10", "姿勢ケア5分＋セルフマッサージ3分＋目元1分", "日中に済ませていればスキップ"],
      ["n-phone", "0:30", "スマホを置く・照明を落とす", ""],
      ["n-sleep", "1:00", "就寝", ""]
    ]]
  ];

  // ---- その日だけのこと ----
  function buildDay(d) {
    const info = dayInfo(d);
    const { dow, type, w } = info;
    const gym = SESSIONS[type];
    const items = [];
    const weekday = dow >= 1 && dow <= 5;
    if (MEAT_NIGHT.includes(dow)) items.push(["x-vitd", "朝", "ビタミンDを飲む", "今夜は肉の日"]);
    if (dow === 0 && w < 8) {
      items.push(["s-measure", "朝", "ウエスト・首回りを測る", "起床後すぐ、息を吐き切って"]);
      items.push(["s-photo", "8:00", "写真4枚（正面・横・背面・横顔）→ Instagram", "むくみが引いてから"]);
      items.push(["s-report", "午前", "Claudeに週次の報告", "weekly_review の「送るもの」。来週の出社日をカレンダーで設定"]);
    }
    if (type === "office") {
      items.push(["o-train", "行き", "話し方トレーニング（07）", "前半インプット、後半は今日のネタを起承転結でメモ"]);
      items.push(["o-lunch", "昼", "コンビニのセット＋昼休みに10分歩く", "P20g以上の商品1つ＋主食1つ＋野菜1つ"]);
      items.push(["o-back", "帰り", "会話の振り返り＋Homework for Life 1行", ""]);
    } else if (weekday) {
      items.push(["h-walk", "日中", "50分作業 → トレッドミル15分 × 4回", "5–6km/h、合計60分"]);
      items.push(["h-voice", "日中", "家の発声メニュー5分（09）", ""]);
    }
    if (gym) {
      items.push(["g-gym", weekday ? "18:30" : "午前", `ジム：${type}（${gym.name}）${info.hiit ? "＋HIIT" : ""}${WALK.includes(type) ? "＋傾斜ウォーク20分" : ""}`, PHASE[w].rule]);
    }
    if (dow === 0 && w < 8) items.push(["prep", "午後", "献立を決めて買い出し → 作り置き60分", "04の入れ替え表から1週間分"]);
    if (dow === 3) items.push(["prep", "夜", "後半分の買い出しと作り置き60分", ""]);
    if (dow === 0 && w < 8) items.push(["s-voice", "夜", "1分原稿の録音＋2分トークの自撮り → 見返す（09）", ""]);
    return { info, items };
  }

  let current = clamp(today);
  const viewToday = document.getElementById("view-today");
  const viewRoutine = document.getElementById("view-routine");

  const itemHtml = (checks) => ([id, t, label, sub]) => `
    <label class="item${checks[id] ? " checked" : ""}" for="c-${id}">
      <input type="checkbox" id="c-${id}" data-id="${id}"${checks[id] ? " checked" : ""}>
      <span class="t">${t}</span>
      <span class="x"><span>${label}</span>${sub ? `<small>${sub}</small>` : ""}</span>
    </label>`;

  function dayNav(d, info) {
    const wn = info.w < 8 ? `W${info.w + 1}` : "判定日";
    return `<div class="daynav">
      <button class="navbtn" data-nav="-1" aria-label="前の日">‹</button>
      <span class="date">${md(d)}（${DOW[info.dow]}）</span>
      <button class="navbtn" data-nav="1" aria-label="次の日">›</button>
      <span class="wk">${wn}${info.w < 8 ? " · " + PHASE[info.w].label : ""}</span>
      ${chip(info.type)}
      ${key(d) !== key(clamp(today)) ? `<button class="navbtn today" data-nav="0">今日へ</button>` : ""}
    </div>`;
  }

  function checklist(title, groups, k, checks) {
    const all = groups.flatMap(g => g[1]);
    const done = all.filter(i => checks[i[0]]).length;
    return `<div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h3>${title}</h3><span class="count">${done} / ${all.length}</span>
      </div>
      <div class="bar"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></div>
      ${all.length ? groups.map(([g, items]) => `<div class="todo-group">${g ? `<h4>${g}</h4>` : ""}${items.map(itemHtml(checks)).join("")}</div>`).join("") : `<div class="note">今日だけのことはありません。毎日のルーティンだけでOK。</div>`}
    </div>`;
  }

  function wire(view, k, rerender) {
    view.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
      const c = store.get("todo:" + k, {});
      c[cb.dataset.id] = cb.checked;
      store.set("todo:" + k, c);
      rerender();
    }));
    view.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
      const n = +b.dataset.nav;
      current = n === 0 ? clamp(today) : clamp(addDays(current, n));
      rerender();
    }));
  }

  // ---- render: today（その日だけのこと） ----
  function renderToday() {
    const d = current;
    const { info, items } = buildDay(d);
    const k = key(d);
    const checks = store.get("todo:" + k, {});
    const events = (DATED[k] || []).concat(info.w < 8 && info.dow === 0 && !(DATED[k] || []).length ? ["週次レビュー"] : []);
    const wn = info.w < 8 ? `W${info.w + 1}` : "判定日";
    const gym = SESSIONS[info.type];
    const ph = PHASE[info.w];

    let sessionHtml = "";
    if (gym) {
      sessionHtml = `<div class="panel">
        <h3>今日のジム</h3>
        <div class="session-head">${chip(info.type)}<b>${gym.name}</b>${info.hiit ? `<span class="chip hiit">＋HIIT</span>` : ""}${WALK.includes(info.type) ? `<span class="chip hiit">＋傾斜20分</span>` : ""}</div>
        <div class="phase">${wn} ${ph.label}：${ph.rule}</div>
        <table class="ex"><tbody>${gym.ex.map(e => `<tr><td>${e[0]}</td><td>${e[1]}</td></tr>`).join("")}</tbody></table>
        ${info.hiit ? `<div class="note">筋トレの後にバイクHIIT：20秒きつく＋100秒軽く × ${info.w <= 1 ? 6 : "6–8"}本</div>` : ""}
        ${WALK.includes(info.type) ? `<div class="note">最後に傾斜ウォーク20分：傾斜10–12%・5.0–5.5km/h・手すりを持たない</div>` : ""}
        <div class="note">上限回数を全セットでできたら次回+2.5kg。重量×回数を記録。</div>
      </div>`;
    } else {
      const label = info.type === "office" ? "出社日＝休養日" : info.type === "judge" ? "最終判定の日" : "休養日";
      sessionHtml = `<div class="panel"><h3>今日のジム</h3><div class="session-head">${chip(info.type)}<b>${label}</b></div><div class="note">筋トレなし。</div></div>`;
    }
    const meal = MEALS[info.dow];
    const office = info.type === "office";
    const lunch = office ? "コンビニのセット（①定番 ②麺 ③時間がない）" : (meal[1] || BASE_LUNCH);

    viewToday.innerHTML = `
      <div style="display:grid;gap:16px">
        ${dayNav(d, info)}
        ${events.length ? `<div class="panel"><h3>今日の予定</h3><div class="events">${events.map(e => `<div class="ev">${e}</div>`).join("")}</div></div>` : ""}
        <div class="grid2">
          <div style="display:grid;gap:16px;min-width:0">
            ${checklist("今日だけのこと", [["", items]], k, checks)}
            <div class="panel">
              <h3>今日の食事（1,900kcal・P170g）</h3>
              <div class="meal"><b>朝</b><span>${meal[0]}</span></div>
              <div class="meal"><b>昼</b><span>${lunch}</span></div>
              <div class="meal"><b>間食</b><span>プロテイン＋低脂肪乳＋アーモンド（または間食の型）</span></div>
              <div class="meal"><b>夜</b><span>${meal[2]}${office ? "＋ブロッコリー100g" : ""}</span></div>
              <div class="note">ご飯は昼150g・夜100g、夜のメインは入れ替え表の1.2倍（04）。</div>
            </div>
          </div>
          <div style="display:grid;gap:16px;min-width:0">
            ${sessionHtml}
            ${info.w < 8 ? `<div class="panel"><h3>${wn}のうちにやること</h3><div class="events">${WEEK_NOTES[info.w].map(n => `<div class="ev wknote">${n}</div>`).join("")}<div class="ev wknote">人と関わる枠：VRChat 1回＋対面 1回</div></div></div>` : ""}
          </div>
        </div>
      </div>`;
    wire(viewToday, k, renderToday);
  }

  // ---- render: 毎日のルーティン ----
  function renderRoutine() {
    const d = current;
    const info = dayInfo(d);
    const k = key(d);
    const checks = store.get("todo:" + k, {});
    viewRoutine.innerHTML = `
      <div style="display:grid;gap:16px;max-width:560px">
        ${dayNav(d, info)}
        ${checklist("毎日のルーティン", ROUTINE, k, checks)}
        <div class="note">毎日同じ内容。その日だけのことは「今日」タブ。</div>
      </div>`;
    wire(viewRoutine, k, renderRoutine);
  }

  // ---- render: calendar ----
  const viewCal = document.getElementById("view-calendar");
  function renderCalendar() {
    const todayKey = key(today);
    const curW = weekOf(today);
    let html = `<div style="display:grid;gap:14px">
      <div class="legend">${["U", "L", "Push", "Pull", "Legs"].map(t => chip(t)).join("")}${chip("office")}${chip("rest")}<span>曜日ボタンで出社日を選ぶと、残りの日に U→L→Push→Pull→Legs が入る</span></div>`;
    for (let w = 0; w < 8; w++) {
      const plan = planWeek(w);
      const s = addDays(START, w * 7);
      const office = getOffice(w);
      html += `<article class="week${w === curW ? " current" : ""}">
        <div class="whead"><span class="wn">W${w + 1}</span><span class="wd">${md(s)} – ${md(addDays(s, 6))}</span><span class="ph">${PHASE[w].label}</span>
          <span class="office-pick" style="margin-left:auto">出社日
            ${DOW.map((n, i) => `<button type="button" id="o-${w}-${i}" data-w="${w}" data-d="${i}" aria-pressed="${office.includes(i)}" aria-label="W${w + 1} ${n}曜を出社日にする">${n}</button>`).join("")}
          </span></div>
        <div class="days">${plan.map((p, i) => {
          const d = addDays(s, i), k = key(d);
          const evs = (DATED[k] || []).concat(i === 0 && !(DATED[k] || []).length ? ["週次レビュー"] : []);
          return `<button type="button" class="day${k === todayKey ? " is-today" : ""}${i === 0 ? " sun" : ""}" data-date="${k}">
            <span class="d"><span>${md(d)}</span><span class="dow">${DOW[i]}</span></span>
            ${chip(p.type)}${p.hiit ? `<span class="chip hiit">HIIT</span>` : ""}
            ${evs.length ? `<span class="evs">${evs.join("<br>")}</span>` : ""}
          </button>`;
        }).join("")}</div>
        <div class="wnotes">${WEEK_NOTES[w].map(n => `<div class="ev wknote">${n}</div>`).join("")}</div>
      </article>`;
    }
    html += `<div class="judge"><b>11/22（日）最終判定</b><span>ウエスト・体脂肪率・ベンチを計測、Before/After写真と動画、次の8週間の計画</span></div></div>`;
    viewCal.innerHTML = html;

    viewCal.querySelectorAll(".office-pick button").forEach(b => b.addEventListener("click", () => {
      const w = +b.dataset.w, d = +b.dataset.d;
      const list = getOffice(w).slice();
      const i = list.indexOf(d);
      if (i >= 0) list.splice(i, 1); else list.push(d);
      officeDays[w] = list.sort();
      store.set("office", officeDays);
      renderCalendar();
      renderProgress();
    }));
    viewCal.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => {
      const [y, m, dd] = b.dataset.date.split("-").map(Number);
      current = new Date(y, m - 1, dd);
      show("today");
    }));
  }

  function renderProgress() {
    const total = dayIndex(END) + 1;
    const n = Math.min(Math.max(dayIndex(today) + 1, 0), total);
    const w = weekOf(clamp(today));
    document.getElementById("prog-label").textContent = n <= 0 ? "開始前" : `${w < 8 ? "W" + (w + 1) : "判定"} · Day ${n} / ${total}`;
    document.getElementById("prog-bar").style.width = (n / total * 100) + "%";
  }

  function show(tab) {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    ["today", "routine", "calendar"].forEach(t => { document.getElementById("view-" + t).hidden = tab !== t; });
    if (tab === "today") renderToday(); else if (tab === "routine") renderRoutine(); else renderCalendar();
    store.set("tab", tab);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));

  renderProgress();
  const hash = location.hash.replace("#", "");
  const TABS = ["today", "routine", "calendar"];
  const saved = store.get("tab", "today");
  show(TABS.includes(hash) ? hash : TABS.includes(saved) ? saved : "today");
})();
</script>
