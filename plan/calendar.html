<style>

  --push: #c99a00;   /* 15kg yellow */
  --pull: #2d7a47;   /* 10kg green */
  --legs: #474d55;   /* black plate */
  --office: #7a6a58;
  --rest: #8a9199;
  --event: #8b3a8f;
  --done: #2d7a47;

    --ink: #e7e9e5; --on-ink: #14171a;
    --u: #f0685d; --l: #6d9ce8; --push: #f0c53d; --pull: #5fbf7f; --legs: #aab1ba;

}
:root[data-theme="dark"] {

  --ink: #e7e9e5; --on-ink: #14171a;
  --u: #f0685d; --l: #6d9ce8; --push: #f0c53d; --pull: #5fbf7f; --legs: #aab1ba;

}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }

.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.chip.rest { background: transparent; color: var(--rest); border: 1.5px dashed var(--rest); }

.navbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 12px; cursor: pointer; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.todo-group + .todo-group { margin-top: 6px; }

.meal { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; font-size: 14px; }

/* calendar */
.legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.legend-box summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
.legend-box summary::-webkit-details-marker { display: none; }
.legend-box summary::after { content: "▾"; color: var(--muted); font-size: 12px; }
.legend-box:not([open]) summary::after { content: "▸"; }

.evs-sample { color: var(--event); font-size: 12.5px; }

.day .d .dow { color: var(--muted); font-weight: 500; }
.day.sun .d .dow { color: var(--u); }
.day .evs { display: grid; gap: 2px; font-size: 11.5px; line-height: 1.35; color: var(--event); overflow-wrap: anywhere; }
.day .chip { font-size: 13px; padding: 0 6px; width: fit-content; }
.wnotes { display: grid; gap: 3px; font-size: 13px; }
.wnotes .ev { gap: 6px; }
.judge { background: var(--ink); color: var(--on-ink); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.judge b { font-family: var(--font-display); font-size: 24px; }
@media (max-width: 560px) {
  .day { min-height: 76px; padding: 4px 3px; }

  .day .evs { font-size: 10.5px; }
  .day .chip.hiit { font-size: 10px; padding: 0 3px; }
  .day .d .dow { display: none; }
  .day .d { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s; } }
</style>

<style>
/* links out to the markdown that holds the "what / how" */
a { color: inherit; }

    { body: "", skin: ["", ""], teeth: ["初診相談（2–3院）→ 精密検査を予約", LINK.ortho], voice: ["腹式呼吸とリップロールで喉が楽な声をつかむ・サ・タ行", LINK.amenbo], other: "" },
    { body: "", skin: ["", ""], teeth: ["精密検査", LINK.ortho], voice: ["V4・V5のテンポを上げる・ナ・ハ行", LINK.amenbo], other: "" },
    { body: "", skin: ["写真で肌をDay1と比べる", LINK.insta], teeth: ["治療計画の説明 → 1週間考える", LINK.ortho], voice: ["同じ条件で1分原稿を録音・マ・ヤ行", LINK.amenbo], other: "" },
    { body: "", skin: ["", ""], teeth: ["契約 → 前処置", LINK.ortho], voice: ["会議で話し方のルール3つを使う・ラ・ワ行", LINK.meeting], other: "" },
    { body: "", skin: ["", ""], teeth: ["ワイヤーなら装着", LINK.ortho], voice: ["会議で話し方のルール3つを使う・あめんぼを通しで", LINK.meeting], other: "" },
    { body: "", skin: ["", ""], teeth: ["", ""], voice: ["あめんぼの歌を通しで", LINK.amenbo], other: "" },
    { body: "最後に食事を削らない", skin: ["12月以降の肌ケア（レチノール・ダーマペン）を決める", LINK.later], teeth: ["マウスピースなら装着開始（12月でも可）", LINK.ortho], voice: ["Day1の録音と聴き比べ", LINK.voiceSun], other: "" }
  ];
  const MEAT_NIGHT = [0, 2];                     // 02の献立例で夜が肉の曜日（ビタミンD）

  // 毎日のルーティン（中身は 01・03・04・05）
  const ROUTINE = [
    ["朝", [
      ["m-weigh", "7:00", "体重・体脂肪を測る", ""],
      ["m-mirror", "7:05", "鏡で正面と横顔を見る", ""],
      ["m-skin", "7:10", "洗顔 → 保湿 → 日焼け止め", LINK.skinDaily],
      ["m-food", "7:15", "朝食", LINK.swap],
      ["m-sleep", "7:30", "睡眠時間を確認", ""]
    ]],
    ["日中", [
      ["d-steps", "", "1万歩", LINK.walking],
      ["d-face", "", "顔・首＋発声 15分", LINK.car],
      ["d-snack", "15:30", "間食", LINK.swap]
    ]],
    ["夜", [
      ["n-asken", "23:30", "あすけん確認・翌日の準備", ""],
      ["n-skin", "0:00", "洗顔 → 保湿", LINK.skinDaily],
      ["n-posture", "0:10", "姿勢ケア＋マッサージ＋目元", LINK.posture],
      ["n-phone", "0:30", "スマホを置く", ""],
      ["n-sleep", "1:00", "就寝", ""]
    ]]
  ];
  // ======================================================================

  // ---- 曜日ごとの筋トレ（日曜は計測・報告・作り置き、木曜は中休み） ----
  const WEEK = ["rest", "U", "L", "Push", "rest", "Pull", "Legs"];  // 日〜土
  function planWeek(w) {
    const out = WEEK.map(type => ({ type, hiit: false }));
    const hiitOn = HIIT_BY_PHASE[PHASE[w]];
    const done = new Set();
    out.forEach(o => { if (hiitOn.includes(o.type) && !done.has(o.type)) { o.hiit = true; done.add(o.type); } });
    if (hiitOn.length && !done.size) { const u = out.find(o => o.type === "U"); if (u) u.hiit = true; }
    return out;
  }
  function dayInfo(d) {
    const w = weekOf(d), dow = d.getDay();
    if (w >= 8) return { w, dow, type: "judge", hiit: false };
    const p = planWeek(w)[dow];
    return { w, dow, type: p.type, hiit: p.hiit };
  }
  function eventsOn(k) {
    const list = (DATED[k] || []).slice();
    BOOKINGS.filter(b => b.date === k).forEach(b => list.push([`${b.name}${b.time ? " " + b.time : ""}${b.place ? "（" + b.place + "）" : ""}`, b.link]));
    return list;
  }
  const chip = type => {
    if (type === "rest") return `<span class="chip rest">休養</span>`;
    if (type === "judge") return `<span class="chip office">判定</span>`;
    return `<span class="chip ${type}">${type}</span>`;
  };

  // ---- その日だけのこと（中身は 01・02・05） ----
  function buildDay(d) {
    const info = dayInfo(d);
    const { dow, type, w } = info;
    const items = [];
    const weekday = dow >= 1 && dow <= 5;
    if (MEAT_NIGHT.includes(dow)) items.push(["x-vitd", "朝", "ビタミンD（今夜は肉）", LINK.supp]);
    if (dow === 0 && w < 8) {
      items.push(["s-measure", "起床後", "ウエストを測る", LINK.measure]);
      items.push(["s-photo", "8:00", "写真4枚 → Instagram", LINK.insta]);
      items.push(["s-report", "午前", "Claudeに週次の報告", LINK.send]);
    }
    if (weekday) {
      items.push(["h-walk", "日中", "トレッドミル休憩 15分×4", LINK.walking]);
      items.push(["h-voice", "日中", "家の発声メニュー 5分", LINK.voiceHome]);
    }
    if (SESSION_NAME[type]) {
      const t = weekday ? "18:30" : "午前";
      items.push(["g-gym", t, `ジム：${type}（${SESSION_NAME[type]}）`, LINK[type]]);
      if (info.hiit) items.push(["g-hiit", "", "HIIT（バイク）", LINK.cardio]);
      if (WALK.includes(type)) items.push(["g-walk", "", "傾斜ウォーク 20分", LINK.cardio]);
    }
    if (dow === 0 && w < 8) items.push(["prep", "午後", "献立・買い出し・作り置き", LINK.prep]);
    if (dow === 3) items.push(["prep", "夜", "買い出し・作り置き", LINK.prep]);
    if (dow === 0 && w < 8) items.push(["s-voice", "夜", "1分原稿の録音", LINK.voiceSun]);
    return { info, items };
  }

  let current = clamp(today);
  const views = { today: null, routine: null, calendar: null, roadmap: null };
  Object.keys(views).forEach(k => { views[k] = document.getElementById("view-" + k); });

  const itemHtml = checks => ([id, t, label, href]) => `
    <div class="item${checks[id] ? " checked" : ""}">
      <input type="checkbox" id="c-${id}" data-id="${id}" aria-label="${label}"${checks[id] ? " checked" : ""}>
      <span class="t">${t}</span>
      ${href ? `<a class="x" href="${href}" target="_blank" rel="noopener"><span>${label}</span></a>` : `<span class="x plain"><span>${label}</span></span>`}
    </div>`;

  function checklist(title, groups, checks, empty) {
    const all = groups.flatMap(g => g[1]);
    const done = all.filter(i => checks[i[0]]).length;
    return `<div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h3>${title}</h3><span class="count">${done} / ${all.length}</span>
      </div>
      <div class="bar"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></div>
      ${all.length ? groups.map(([g, items]) => `<div class="todo-group">${g ? `<h4>${g}</h4>` : ""}${items.map(itemHtml(checks)).join("")}</div>`).join("") : `<div class="note">${empty}</div>`}
      <div class="note">↗ の項目をタップすると、やり方（markdown）が開く。</div>
    </div>`;
  }

  function dayNav(d, info) {
    const wn = info.w < 8 ? `W${info.w + 1}` : "判定日";
    return `<div class="daynav">
      <button class="navbtn" data-nav="-1" aria-label="前の日">‹</button>
      <span class="date">${md(d)}（${DOW[info.dow]}）</span>
      <button class="navbtn" data-nav="1" aria-label="次の日">›</button>
      <span class="wk">${wn}${info.w < 8 ? " · " + PHASE[info.w] : ""}</span>
      ${chip(info.type)}
      ${key(d) !== key(clamp(today)) ? `<button class="navbtn today" data-nav="0">今日へ</button>` : ""}
    </div>`;
  }

  function wire(view, k, rerender) {
    view.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
      const c = store.get("todo:" + k, {});
      c[cb.dataset.id] = cb.checked;
      store.set("todo:" + k, c);
      rerender();
    }));
    view.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
      const n = +b.dataset.nav;
      current = n === 0 ? clamp(today) : clamp(addDays(current, n));
      rerender();
    }));
  }

  function weekTracks(w) {
    const r = ROADMAP[w];
    const rows = [
      ["体づくり", `段階：${a(LINK.phase, PHASE[w])}${HIIT_BY_PHASE[PHASE[w]].length ? `・HIIT 週${HIIT_BY_PHASE[PHASE[w]].length}回` : "・HIITなし"}${r.body ? "・" + r.body : ""}`],
      ["肌", r.skin[0] && a(r.skin[1], r.skin[0])],
      ["歯", r.teeth[0] && a(r.teeth[1], r.teeth[0])],
      ["声", r.voice[0] && a(r.voice[1], r.voice[0])],
      ["その他", r.other]
    ].filter(x => x[1]);
    return `<dl class="tracks">${rows.map(([t, v]) => `<dt>${t}</dt><dd>${v}</dd>`).join("")}</dl>`;
  }

  // ---- 今日 ----
  function renderToday() {
    const d = current, k = key(d);
    const { info, items } = buildDay(d);
    const checks = store.get("todo:" + k, {});
    const events = eventsOn(k);
    const wn = info.w < 8 ? `W${info.w + 1}` : "判定日";
    const bookingsDue = info.w < 8 ? BOOKINGS.filter(b => b.week === info.w && !b.date) : [];
    views.today.innerHTML = `
      <div style="display:grid;gap:16px">
        ${dayNav(d, info)}
        ${events.length ? `<div class="panel"><h3>今日の予定</h3><div class="events">${events.map(([t, l]) => `<div class="ev">${a(l, t)}</div>`).join("")}</div></div>` : ""}
        <div class="grid2">
          <div style="display:grid;gap:16px;min-width:0">
            ${checklist("今日だけのこと", [["", items]], checks, "今日だけのことはなし。毎日のルーティンだけでOK。")}
            <div class="panel">
              <h3>食事</h3>
              <div class="linkrow"><b>献立</b>${a(LINK.menu, `02の献立例の${DOW[info.dow]}曜日`)}</div>
              <div class="linkrow"><b>替える</b>${a(LINK.swap, "入れ替え表")}</div>
            </div>
          </div>
          <div style="display:grid;gap:16px;min-width:0">
            ${info.w < 8 ? `<div class="panel"><h3>${wn}（${md(addDays(START, info.w * 7))}–${md(addDays(START, info.w * 7 + 6))}）のロードマップ</h3>${weekTracks(info.w)}
              ${bookingsDue.length ? `<div class="note">今週中に予約：${bookingsDue.map(b => b.name).join("・")}</div>` : ""}</div>` : ""}
          </div>
        </div>
      </div>`;
    wire(views.today, k, renderToday);
  }

  // ---- 毎日 ----
  function renderRoutine() {
    const d = current, k = key(d);
    const info = dayInfo(d);
    const checks = store.get("todo:" + k, {});
    views.routine.innerHTML = `
      <div style="display:grid;gap:16px;max-width:560px">
        ${dayNav(d, info)}
        ${checklist("毎日のルーティン", ROUTINE, checks, "")}
        <div class="note">崩れた日は「体重を測る・あすけんにざっくり入力・日焼け止め・1:00に寝る」の4つだけ。</div>
      </div>`;
    wire(views.routine, k, renderRoutine);
  }

  // ---- カレンダー ----
  function renderCalendar() {
    const todayKey = key(today);
    const curW = weekOf(today);
    let html = `<div style="display:grid;gap:14px">
      <details class="panel legend-box" id="legend"${store.get("legendOpen", true) ? " open" : ""}>
        <summary><h3>凡例</h3></summary>
        <dl class="legend-grid">
          ${["U", "L", "Push", "Pull", "Legs"].map(t => `<dt>${chip(t)}</dt><dd>${a(LINK[t], SESSION_NAME[t])}の筋トレ${WALK.includes(t) ? "＋傾斜ウォーク20分" : ""}</dd>`).join("")}
          <dt><span class="chip hiit">HIIT</span></dt><dd>筋トレの後にバイクHIIT（${a(LINK.cardio, "やり方")}）</dd>
          <dt>${chip("rest")}</dt><dd>休養日（日・木）。筋トレなし、1万歩だけ</dd>
          <dt><span class="evs-sample">紫の文字</span></dt><dd>その日の予定・予約・判定。日曜は週次レビュー</dd>
          <dt><span class="today-sample">${md(clamp(today))}</span></dt><dd>太い枠は今日。日付をタップするとその日の「今日」タブが開く</dd>
          <dt><span class="ph">本番</span></dt><dd>週の横のラベルはトレーニングの段階（${a(LINK.phase, "段階の中身")}）</dd>
        </dl>
      </details>`;
    for (let w = 0; w < 8; w++) {
      const plan = planWeek(w);
      const s = addDays(START, w * 7);
      html += `<article class="week${w === curW ? " current" : ""}">
        <div class="whead"><span class="wn">W${w + 1}</span><span class="wd">${md(s)} – ${md(addDays(s, 6))}</span><span class="ph">${PHASE[w]}</span></div>
        <div class="days">${plan.map((p, i) => {
          const d = addDays(s, i), k = key(d);
          const evs = eventsOn(k).map(e => e[0]).concat(i === 0 ? ["週次レビュー"] : []);
          return `<button type="button" class="day${k === todayKey ? " is-today" : ""}${i === 0 ? " sun" : ""}" data-date="${k}">
            <span class="d"><span>${md(d)}</span><span class="dow">${DOW[i]}</span></span>
            ${chip(p.type)}${p.hiit ? `<span class="chip hiit">HIIT</span>` : ""}
            ${evs.length ? `<span class="evs">${evs.join("<br>")}</span>` : ""}
          </button>`;
        }).join("")}</div>
      </article>`;
    }
    html += `<div class="judge"><b>11/22（日）最終判定</b><span>ウエスト・体脂肪率・ベンチを計測、Before/After写真と動画、次の8週間の計画</span></div></div>`;
    views.calendar.innerHTML = html;

    const lg = document.getElementById("legend");
    if (lg) lg.addEventListener("toggle", () => store.set("legendOpen", lg.open));
    views.calendar.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => {
      const [y, m, dd] = b.dataset.date.split("-").map(Number);
      current = new Date(y, m - 1, dd);
      show("today");
    }));
  }

  // ---- ロードマップ ----
  function renderRoadmap() {
    const curW = weekOf(today);
    const judges = Object.entries(DATED).filter(([, v]) => v.some(e => e[1] === LINK.recover || e[1] === LINK.kpi));
    const fmt = k => { const [y, m, d] = k.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${md(dt)}（${DOW[dt.getDay()]}）`; };
    let html = `<div class="rm">
      <div class="panel"><h3>判定の日</h3><div class="events">${judges.map(([k, v]) => v.filter(e => e[1] === LINK.recover || e[1] === LINK.kpi).map(e => `<div class="milestone"><span class="count" style="font-size:16px;min-width:74px">${fmt(k)}</span>${a(e[1], e[0])}</div>`).join("")).join("")}</div>
        <div class="note">週ごとの目標ラインは ${a(LINK.targets, "goals-kpiの目標ライン")}、外れたときは ${a(LINK.recover, "recovery-rulesのルール")}。</div></div>`;
    for (let w = 0; w < 8; w++) {
      const s = addDays(START, w * 7);
      html += `<article class="rm-week${w === curW ? " current" : ""}">
        <div class="whead"><span class="wn">W${w + 1}</span><span class="wd">${md(s)} – ${md(addDays(s, 6))}</span><span class="ph">${PHASE[w]}</span></div>
        ${weekTracks(w)}
      </article>`;
    }
    html += `<div class="panel"><h3>予約（決まったらClaudeに日時を伝える → カレンダーにも出る）</h3>
      <div class="tbl"><table class="book"><thead><tr><th>予定</th><th>目安</th><th>日時</th><th>場所</th></tr></thead><tbody>
      ${BOOKINGS.map(b => `<tr><td>${a(b.link, b.name)}</td><td class="when">W${b.week + 1}</td><td class="when">${b.date ? fmt(b.date) + (b.time ? " " + b.time : "") : "未定"}</td><td>${b.place || ""}</td></tr>`).join("")}
      </tbody></table></div></div>
      <div class="panel"><h3>中身（何を・どうやるか）</h3><div class="docs">
        ${[["01 トレーニング", F.train], ["02 食事", F.food], ["03 顔・首・姿勢", F.face], ["04 肌と歯並び", F.skin], ["05 滑舌と声", F.voice], ["ゴールとKPI", F.kpi], ["外れたときのルール", F.recover], ["12月以降検討", F.later], ["週次レビュー", F.review]].map(([t, f]) => a(L(f), t)).join("")}
      </div></div>
    </div>`;
    views.roadmap.innerHTML = html;
  }

  function renderProgress() {
    const total = dayIndex(END) + 1;
    const n = Math.min(Math.max(dayIndex(today) + 1, 0), total);
    const w = weekOf(clamp(today));
    document.getElementById("prog-label").textContent = n <= 0 ? "開始前" : `${w < 8 ? "W" + (w + 1) : "判定"} · Day ${n} / ${total}`;
    document.getElementById("prog-bar").style.width = (n / total * 100) + "%";
  }

  const RENDER = { today: renderToday, routine: renderRoutine, calendar: renderCalendar, roadmap: renderRoadmap };
  function show(tab) {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    Object.keys(views).forEach(t => { views[t].hidden = tab !== t; });
    RENDER[tab]();
    store.set("tab", tab);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));

  renderProgress();
  const hash = location.hash.replace("#", "");
  const saved = store.get("tab", "today");
  show(RENDER[hash] ? hash : RENDER[saved] ? saved : "today");
})();
</script>
